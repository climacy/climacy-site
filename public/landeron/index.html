<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Le Landeron · Maquette 3D, carte CA / CEL et budget · Climacy</title>
<link rel="icon" type="image/svg+xml" href="/assets/Climacy_flavicon.svg" />
<style>
  html, body { margin: 0; height: 100%; background: #131311; color: #f1efe8;
               font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { display: flex; flex-direction: column; }
  nav { flex: none; display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
        padding: 8px 12px; background: #1c1c19; border-bottom: 1px solid #33332e; }
  nav strong { margin-right: auto; font-size: 15px; font-weight: 600; }
  nav a { color: #f1efe8; text-decoration: none; font-size: 14px; padding: 6px 12px;
          border: 1px solid #4a4a43; border-radius: 6px; }
  nav a[hidden] { display: none; }
  nav a[aria-current="page"] { background: #f1efe8; color: #131311; border-color: #f1efe8; }
  nav a:focus-visible { outline: 2px solid #f1efe8; outline-offset: 2px; }
  main { position: relative; flex: 1; min-height: 0; }
  #cadre { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  #msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
         margin: 0; padding: 24px; text-align: center; font-size: 17px; line-height: 1.5; }
  #msg[hidden] { display: none; }
</style>
</head>
<body>
<nav aria-label="Vues du projet">
  <strong>Le Landeron</strong>
  <a href="#maquette" data-vue="maquette" hidden>Maquette 3D</a>
  <a href="#carte" data-vue="carte" hidden>Carte CA et CEL</a>
  <a href="#budget" data-vue="budget" hidden>Budget</a>
</nav>
<main>
  <p id="msg">Chargement…</p>
</main>
<script>
  // Des fichiers autonomes sont déposés dans ce même dossier (public/landeron/) :
  // maquette-3d.html (maquette 3D de la toiture), carte.html (adresses CA et CEL)
  // et budget.html (investissement et recettes par variante).
  // Cette page les affiche sous l'adresse /landeron/, avec #maquette, #carte ou #budget,
  // sur le modèle de public/cure/. Un onglet n'apparaît que si son fichier est déposé ;
  // tant qu'aucun fichier ne l'est, on affiche un message plutôt qu'une page d'erreur.
  // Pour la maquette, le nom attendu est maquette-3d.html ; maquette-3dl.html est accepté
  // en second choix, parce que le fichier a été déposé sous ce nom.
  var VUES = {
    maquette: { fichiers: ['maquette-3d.html', 'maquette-3dl.html'], titre: 'Maquette 3D de la toiture, Le Landeron' },
    carte: { fichiers: ['carte.html'], titre: 'Carte des adresses CA et CEL, Le Landeron' },
    budget: { fichiers: ['budget.html'], titre: 'Budget par variante, Le Landeron' }
  };
  var ORDRE = ['maquette', 'carte', 'budget'];
  var zone = document.querySelector('main');
  var msg = document.getElementById('msg');
  var liens = document.querySelectorAll('nav a');

  function afficher() {
    var disponibles = ORDRE.filter(function (nom) { return VUES[nom].present; });
    var ancien = document.getElementById('cadre');
    if (ancien) ancien.remove();
    if (!disponibles.length) {
      msg.hidden = false;
      msg.textContent = 'Les documents de ce projet seront disponibles ici prochainement.';
      return;
    }
    var nom = location.hash.replace('#', '');
    if (disponibles.indexOf(nom) < 0) nom = disponibles[0];
    liens.forEach(function (lien) {
      if (lien.dataset.vue === nom) lien.setAttribute('aria-current', 'page');
      else lien.removeAttribute('aria-current');
    });
    msg.hidden = false;
    msg.textContent = 'Chargement…';
    var cadre = document.createElement('iframe');
    cadre.id = 'cadre';
    cadre.title = VUES[nom].titre;
    cadre.allowFullscreen = true;
    cadre.addEventListener('load', function () { msg.hidden = true; });
    cadre.src = VUES[nom].fichier;
    zone.appendChild(cadre);
  }

  // Renvoie le premier fichier de la liste qui est déposé, ou null.
  function premierDepose(fichiers) {
    return fichiers.reduce(function (suite, fichier) {
      return suite.then(function (trouve) {
        if (trouve) return trouve;
        return fetch(fichier, { method: 'HEAD', cache: 'no-store' })
          .then(function (reponse) { return reponse.ok ? fichier : null; }, function () { return fichier; });
      });
    }, Promise.resolve(null));
  }

  Promise.all(ORDRE.map(function (nom) { return premierDepose(VUES[nom].fichiers); })).then(function (trouves) {
    ORDRE.forEach(function (nom, i) { VUES[nom].fichier = trouves[i]; VUES[nom].present = !!trouves[i]; });
    liens.forEach(function (lien) { lien.hidden = !VUES[lien.dataset.vue].present; });
    window.addEventListener('hashchange', afficher);
    afficher();
  });
</script>
<noscript><style>#msg { display: none; }</style><p style="text-align:center;padding:24px">Cette page a besoin de JavaScript pour afficher la maquette 3D, la carte et le budget.</p></noscript>
</body>
</html>
